name: Treasury dependency preparation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/treasury-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/locked-treasury-creator-fees'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Pump SDKs without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --save-exact --ignore-scripts --no-audit --no-fund @pump-fun/pump-sdk@2.0.0 @pump-fun/pump-swap-sdk@1.13.0
      - name: Promote compatible installed dependencies to explicit pins
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const requested = ['@coral-xyz/anchor','@pump-fun/agent-payments-sdk','@pump-fun/pump-swap-sdk','@solana/spl-token','@solana/web3.js','bn.js','undici-types'];
          const versions = Object.fromEntries(requested.map(name => [name, JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8')).version]));
          cp.execFileSync('npm', ['install','--save-exact','--ignore-scripts','--no-audit','--no-fund', ...requested.filter(n => n !== 'undici-types').map(n => `${n}@${versions[n]}`)], {stdio:'inherit'});
          cp.execFileSync('npm', ['install','--save-dev','--save-exact','--ignore-scripts','--no-audit','--no-fund', `undici-types@${versions['undici-types']}`], {stdio:'inherit'});
          fs.mkdirSync('docs/treasury', {recursive:true});
          fs.writeFileSync('docs/treasury/dependency-versions.json', JSON.stringify({sdk:'@pump-fun/pump-sdk@2.0.0', versions}, null, 2)+'\n');
          NODE
          npm ls @pump-fun/pump-sdk @coral-xyz/anchor @pump-fun/agent-payments-sdk @pump-fun/pump-swap-sdk @solana/spl-token @solana/web3.js bn.js undici-types > treasury-dependencies.txt
      - name: Commit manifests only to the approved feature branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/feat/locked-treasury-creator-fees | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json docs/treasury/dependency-versions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Install and pin the approved Pump and Solana dependency set'
            git push origin HEAD:refs/heads/feat/locked-treasury-creator-fees
          fi
      - name: Retain package source and lockfile for offline compatibility review
        if: always()
        run: |
          mkdir -p treasury-evidence
          cp package.json package-lock.json treasury-evidence/
          cp treasury-dependencies.txt treasury-evidence/ 2>/dev/null || true
          cp docs/treasury/dependency-versions.json treasury-evidence/ 2>/dev/null || true
          tar -czf treasury-evidence/sdk-source.tar.gz node_modules/@pump-fun node_modules/@coral-xyz/anchor/package.json node_modules/@solana/spl-token/package.json node_modules/@solana/web3.js/package.json node_modules/bn.js/package.json node_modules/undici-types/package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treasury-dependency-evidence
          path: treasury-evidence
          retention-days: 7
